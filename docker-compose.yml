services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  app:
    build: .
    depends_on:
      - dynamodb
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      USERS_TABLE: ${USERS_TABLE:-stockscope-users}
      FAVORITES_TABLE: ${FAVORITES_TABLE:-stockscope-favorites}
      SIGNUPS_TABLE: ${SIGNUPS_TABLE:-stockscope-signups}
      POST_SAVE_DELAY_SECONDS: ${POST_SAVE_DELAY_SECONDS:-5}
      STOCK_DATA_PROVIDER: ${STOCK_DATA_PROVIDER:-finnhub}
    ports:
      - "5000:5000"
