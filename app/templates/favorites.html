{% extends 'base.html' %}
{% block title %}StockScope | Favorites{% endblock %}
{% block content %}
<section class="hero small">
  <h1>My Favorites</h1>
  <p>Track your saved stocks and review key metrics.</p>
</section>

<section class="card">
  <p><a class="link-button" href="{{ url_for('industry_page') }}">Go to Industry Filter/Search</a></p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Industry</th>
          <th>Growth %</th>
          <th>P/E</th>
          <th>Growth/P-E</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="favorites-body"></tbody>
    </table>
  </div>
</section>
{% endblock %}
