{% extends 'base.html' %}
{% block title %}StockScope | Industry Filter{% endblock %}
{% block content %}
<section class="hero small">
  <h1>Industry Filter / Search</h1>
  <p>Search your favorites by industry (Tech, Healthcare, Auto, Clothing, and more).</p>
</section>

<section class="card">
  <form id="industry-form" class="search-form">
    <label for="industry-filter">Filter Industry</label>
    <div class="search-row">
      <input id="industry-filter" name="industry" placeholder="Technology" />
      <button type="submit">Search</button>
    </div>
  </form>
</section>

<section class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Industry</th>
          <th>Growth %</th>
          <th>P/E</th>
          <th>Growth/P-E</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="favorites-body"></tbody>
    </table>
  </div>
  <p><a class="link-button" href="{{ url_for('index') }}">Back to Search</a></p>
</section>
{% endblock %}
