<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}StockScope{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">StockScope</a>
      <nav>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('index') }}">Search</a>
        <a href="{{ url_for('industry_page') }}">Favorites</a>
        <a href="{{ url_for('profile_page') }}">Profile</a>
        <span class="username">{{ current_user.username }}</span>
        <form method="post" action="{{ url_for('logout_user_route') }}" class="inline-form">
          <button type="submit">Logout</button>
        </form>
        {% else %}
        <a href="{{ url_for('login_page') }}">Login</a>
        <a href="{{ url_for('register_page') }}">Register</a>
        {% endif %}
      </nav>
    </header>

    <main class="layout">{% block content %}{% endblock %}</main>

    <div id="error-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="error-title" hidden>
      <div class="modal-card">
        <h3 id="error-title">Ticker Not Found</h3>
        <p id="error-message">We could not find that stock ticker.</p>
        <button id="close-error-modal" type="button">Close</button>
      </div>
    </div>

    <script>
      window.APP_STATE = {
        isAuthenticated: {{ 'true' if current_user.is_authenticated else 'false' }},
      };
    </script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
